name: competition_manager
description: A competition management system for robotics tournaments
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # Navegación y estado
  provider: ^6.1.1
  go_router: ^13.2.1
  
  # Imágenes y multimedia
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  
  # Red (para cuando conectes con API)
  dio: ^5.4.0
  http: ^1.2.0
  
  # Utilidades
  intl: ^0.18.1
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/